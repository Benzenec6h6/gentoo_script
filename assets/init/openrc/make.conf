# OpenRC 向け make.conf

COMMON_FLAGS="-O2 -pipe -march=native"
CFLAGS="${COMMON_FLAGS}"
CXXFLAGS="${COMMON_FLAGS}"
MAKEOPTS="-j8 -l8"

# Gentooミラー
GENTOO_MIRRORS="https://ftp.jaist.ac.jp/pub/Linux/Gentoo/"

# バイナリパッケージ
FEATURES="buildpkg"

# コンパイル済みパッケージの保存場所
PKGDIR="/var/cache/binpkgs"

# USE フラグ (OpenRC を使うため systemd を無効化)
USE="openrc elogind unicode pipewire dbus wayland -X -xcb -systemd"

# 32bit 64bit
ABI_X86="32 64"

# 言語ロケール
LINGUAS="ja en"

# Python バージョン
PYTHON_TARGETS="python3_13"
PYTHON_SINGLE_TARGET="python3_13"

# ビルドツール
ACCEPT_LICENSE="*"
